<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "#eaff00",
              "surface": "#0a0a0b",
              "surface-bright": "#121214",
              "on-surface": "#e3e2e7",
              "on-surface-variant": "#c7c9ab",
              "outline": "#919378",
              "background": "#000000"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.75rem",
              "2xl": "1.25rem",
              "full": "9999px"
            },
            "spacing": {
              "gutter": "24px",
              "xs": "4px",
              "sm": "12px",
              "md": "24px",
              "lg": "48px",
              "xl": "80px",
              "container-max": "1280px"
            },
            "fontFamily": {
              "body": ["Hanken Grotesk", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"]
            }
          }

<style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #eaff00; border-radius: 10px; }
        
        body { 
            background-color: #000000;
            font-family: 'Hanken Grotesk', sans-serif;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 255, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            border-color: rgba(234, 255, 0, 0.6);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            box-shadow: 0 0 30px rgba(234, 255, 0, 0.1);
            transform: translateY(-2px);
        }

        .premium-input {
            background: linear-gradient(180deg, rgba(18, 18, 20, 0.8) 0%, rgba(10, 10, 11, 0.9) 100%);
            box-shadow: inset 0 1px 1px rgba(234, 255, 0, 0.1), 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .label-glow {
            text-shadow: 0 0 10px rgba(234, 255, 0, 0.3);
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(234, 255, 0, 0.1) 50%, transparent 55%);
            animation: shimmer-effect 6s infinite;
        }

        @keyframes shimmer-effect {
            0% { transform: translate(-30%, -30%); }
            100% { transform: translate(30%, 30%); }
        }
    </style>
</head>
